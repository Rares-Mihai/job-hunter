name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, type-check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The build needs no database: every page reads its data at request time.
      - run: npm run build
