name: Linear agents

# Started by the Linear relay (repository_dispatch) or by hand for testing.
on:
  repository_dispatch:
    types: [linear-agent]
  workflow_dispatch:
    inputs:
      issue_id:    { description: "Linear issue UUID (for comments)", required: false }
      identifier:  { description: "Issue id, e.g. JOB-42", required: true }
      title:       { description: "Issue title", required: true }
      description: { description: "Issue description", required: false }

concurrency:
  group: linear-agent-${{ github.event.client_payload.identifier || inputs.identifier }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ISSUE_ID:    ${{ github.event.client_payload.issue_id || inputs.issue_id }}
      IDENT:       ${{ github.event.client_payload.identifier || inputs.identifier }}
      TITLE:       ${{ github.event.client_payload.title || inputs.title }}
      DESCRIPTION: ${{ github.event.client_payload.description || inputs.description }}
      ISSUE_URL:   ${{ github.event.client_payload.url }}
      BRANCH_IN:   ${{ github.event.client_payload.branch }}
      BASE_BRANCH: ${{ vars.AGENT_BASE_BRANCH || github.event.repository.default_branch }}
      TEST_CMD:    ${{ vars.AGENT_TEST_CMD }}
      MAX_REVIEW_ROUNDS: ${{ vars.AGENT_MAX_ROUNDS || '2' }}
      RUN_URL:     ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      LINEAR_API_KEY:    ${{ secrets.LINEAR_API_KEY }}
      # Claude: set ONE of these. The OAuth token uses your Claude Pro/Max plan
      # (make it with `claude setup-token`); the API key is billed per request.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Reviewer, first one set wins: Gemini → Codex → Claude.
      GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL:      ${{ vars.GEMINI_MODEL }}
      OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
      # A PAT or GitHub App token here lets the agent's PR trigger your normal CI.
      # With the default GITHUB_TOKEN the PR is created but other workflows won't run on it.
      GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AGENT_GH_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Install agent CLIs
        run: npm install -g @anthropic-ai/claude-code @openai/codex @google/gemini-cli

      - name: Project setup (optional)
        if: vars.AGENT_SETUP_CMD != ''
        run: bash -c "${{ vars.AGENT_SETUP_CMD }}"

      - name: Prepare branch and task file
        run: |
          chmod +x .github/agents/*.sh
          git config user.name  "linear-agents[bot]"
          git config user.email "linear-agents@users.noreply.github.com"
          BRANCH="${BRANCH_IN:-$(echo "$IDENT" | tr '[:upper:]' '[:lower:]')-agent}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -B "$BRANCH" "origin/$BASE_BRANCH"
          mkdir -p .agent && echo ".agent/" >> .git/info/exclude
          {
            printf '# %s: %s\n\n' "$IDENT" "$TITLE"
            printf '%s\n\n' "$DESCRIPTION"
            printf 'Linear: %s\n' "$ISSUE_URL"
          } > .agent/issue.md

      - name: Tell Linear the agents started
        run: |
          .github/agents/linear-comment.sh "🤖 Agents picked this up (planner → coder → reviewer). Live run: $RUN_URL"

      - name: "Agent 1: planner"
        run: .github/agents/run.sh plan

      - name: Post plan to Linear
        run: |
          { echo "### 🧭 Plan"; echo; cat .agent/plan.md; } > .agent/plan-comment.md
          .github/agents/linear-comment.sh --file .agent/plan-comment.md

      - name: Stop if the planner is blocked
        run: |
          if [ "$(cat .agent/verdict 2>/dev/null)" = "blocked" ]; then
            .github/agents/linear-comment.sh "⛔ Planner needs more detail before coding (see plan above). Add details and re-apply the label."
            exit 1
          fi

      - name: "Agent 2: coder"
        run: .github/agents/run.sh code

      - name: "Agent 3: reviewer (+ fix rounds)"
        run: .github/agents/run.sh review-loop

      - name: Push and open pull request
        run: |
          VERDICT=$(cat .agent/verdict)
          git push --force-with-lease -u origin "$BRANCH"

          {
            echo "Fixes $IDENT"
            echo
            echo "## Plan (planner agent)"
            cat .agent/plan.md
            echo
            echo "## Final review (reviewer agent) — $VERDICT"
            cat .agent/review.md
            echo
            [ -f .agent/tests.status ] && echo "Tests: $(cat .agent/tests.status)"
            echo
            echo "---"
            echo "Generated by the Linear agents workflow: $RUN_URL"
          } > .agent/pr.md

          DRAFT=""; [ "$VERDICT" != "approved" ] && DRAFT="--draft"
          PR_URL=$(gh pr view "$BRANCH" --json url -q .url 2>/dev/null || true)
          if [ -n "$PR_URL" ]; then
            gh pr edit "$BRANCH" --body-file .agent/pr.md
          else
            PR_URL=$(gh pr create --base "$BASE_BRANCH" --head "$BRANCH" \
              --title "$IDENT: $TITLE" --body-file .agent/pr.md $DRAFT)
          fi
          echo "PR_URL=$PR_URL" >> "$GITHUB_ENV"

          if [ "$VERDICT" = "approved" ]; then
            MSG="✅ Reviewer approved. PR ready for you: $PR_URL"
          else
            MSG="⚠️ Reviewer still had concerns after $MAX_REVIEW_ROUNDS rounds. Draft PR: $PR_URL"
          fi
          .github/agents/linear-comment.sh "$MSG"

      - name: Report failure to Linear
        if: failure()
        run: |
          [ "$(cat .agent/verdict 2>/dev/null)" = "blocked" ] && exit 0
          .github/agents/linear-comment.sh "❌ Agent run failed. Logs: $RUN_URL"
